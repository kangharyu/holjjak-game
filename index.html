<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>홀짝 게임 기록표</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111827;color:#f9fafb;font-family:"Malgun Gothic",Arial,sans-serif;padding:28px}
.wrap{max-width:900px;margin:auto}
h1{text-align:center;margin:0 0 22px;font-size:34px}
.panel{background:#1f2937;border-radius:18px;padding:24px;box-shadow:0 12px 35px rgba(0,0,0,.25)}
.round{text-align:center;font-size:22px;color:#d1d5db;margin-bottom:16px}
.row{display:flex;gap:14px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:16px 30px;font-size:21px;font-weight:700;cursor:pointer;transition:.15s}
button:hover{filter:brightness(1.08);transform:translateY(-2px)}
.odd{background:#2563eb;color:white}.even{background:#dc2626;color:white}
.success{background:#16a34a;color:white}.fail{background:#6b7280;color:white}
.selected{outline:4px solid #facc15}
.status{text-align:center;min-height:30px;color:#facc15;font-weight:700;margin:6px 0 18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.stat{background:#111827;border-radius:12px;padding:14px;text-align:center;color:#d1d5db}
.stat b{display:block;font-size:28px;color:#fff;margin-top:4px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#111827;border-radius:12px;overflow:hidden}
th,td{padding:14px 10px;text-align:center;border-bottom:1px solid #374151}
th{color:#9ca3af;font-size:15px}
td{font-size:18px}
.tag{display:inline-block;min-width:62px;padding:6px 12px;border-radius:999px;font-weight:700}
.tag.h{background:#1d4ed8}.tag.j{background:#b91c1c}
.tag.s{background:#15803d}.tag.f{background:#4b5563}
.pending{color:#6b7280}
.bottom{text-align:right;margin-top:15px}
.reset{background:#374151;color:#fff;font-size:16px;padding:11px 18px}
.empty{color:#6b7280;padding:30px}
@media(max-width:600px){body{padding:14px}h1{font-size:28px}.panel{padding:16px}.stats{grid-template-columns:1fr}.round{font-size:19px}button{padding:14px 20px;font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
<h1>🎲 홀짝 게임 기록표</h1>
<div class="panel">
  <div class="round" id="roundText">1회차 — 홀짝을 선택하세요</div>

  <div class="row">
    <button class="odd" id="oddBtn" type="button">홀</button>
    <button class="even" id="evenBtn" type="button">짝</button>
  </div>

  <div class="status" id="status">홀 또는 짝을 선택한 뒤 성공/실패를 눌러주세요.</div>

  <div class="row">
    <button class="success" id="successBtn" type="button">✓ 성공</button>
    <button class="fail" id="failBtn" type="button">✕ 실패</button>
  </div>

  <div class="stats">
    <div class="stat">총 게임<b id="total">0</b></div>
    <div class="stat">성공<b id="wins">0</b></div>
    <div class="stat">실패<b id="losses">0</b></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>회차</th>
          <th>홀짝</th>
          <th>성공 여부</th>
        </tr>
      </thead>
      <tbody id="history">
        <tr><td colspan="3" class="empty">게임을 기록하면 여기에 순서대로 표시됩니다.</td></tr>
      </tbody>
    </table>
  </div>

  <div class="bottom">
    <button class="reset" id="resetBtn" type="button">전체 기록 초기화</button>
  </div>
</div>
</div>

<script>
(() => {
  let selected = null;
  const records = [];

  const $ = id => document.getElementById(id);
  const oddBtn = $('oddBtn'), evenBtn = $('evenBtn');
  const status = $('status'), roundText = $('roundText');
  const history = $('history');

  function choose(value) {
    selected = value;
    oddBtn.classList.toggle('selected', value === '홀');
    evenBtn.classList.toggle('selected', value === '짝');
    status.textContent = `${value} 선택 완료 — 성공 또는 실패를 눌러주세요.`;
  }

  function finish(result) {
    if (!selected) {
      status.textContent = '⚠️ 먼저 홀 또는 짝을 선택해주세요.';
      return;
    }

    records.push({
      round: records.length + 1,
      choice: selected,
      result
    });

    selected = null;
    oddBtn.classList.remove('selected');
    evenBtn.classList.remove('selected');
    render();
  }

  function render() {
    const wins = records.filter(r => r.result === '성공').length;
    const losses = records.filter(r => r.result === '실패').length;

    $('total').textContent = records.length;
    $('wins').textContent = wins;
    $('losses').textContent = losses;
    roundText.textContent = `${records.length + 1}회차 — 홀짝을 선택하세요`;

    if (!records.length) {
      history.innerHTML = '<tr><td colspan="3" class="empty">게임을 기록하면 여기에 순서대로 표시됩니다.</td></tr>';
      return;
    }

    history.innerHTML = records.map(r => `
      <tr>
        <td><strong>${r.round}회차</strong></td>
        <td><span class="tag ${r.choice === '홀' ? 'h' : 'j'}">${r.choice}</span></td>
        <td><span class="tag ${r.result === '성공' ? 's' : 'f'}">${r.result}</span></td>
      </tr>
    `).join('');

    status.textContent = `${records.length}회차까지 기록 완료 — 다음 게임을 진행하세요.`;
  }

  oddBtn.addEventListener('click', () => choose('홀'));
  evenBtn.addEventListener('click', () => choose('짝'));
  $('successBtn').addEventListener('click', () => finish('성공'));
  $('failBtn').addEventListener('click', () => finish('실패'));

  $('resetBtn').addEventListener('click', () => {
    if (!records.length || confirm('전체 게임 기록을 초기화할까요?')) {
      records.length = 0;
      selected = null;
      oddBtn.classList.remove('selected');
      evenBtn.classList.remove('selected');
      render();
      status.textContent = '기록이 초기화되었습니다. 새로운 게임을 시작하세요.';
    }
  });

  render();
})();
</script>
</body>
</html>
